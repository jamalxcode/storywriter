<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gold quill, inkpot and document">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset=".45" stop-color="#e2b24c"/>
      <stop offset="1" stop-color="#a8741f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2a3d"/>
      <stop offset=".6" stop-color="#121826"/>
      <stop offset="1" stop-color="#0b0f18"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="32" cy="32" r="31" fill="#2a241d"/>
  <circle cx="32" cy="32" r="29.2" fill="none" stroke="url(#gold)" stroke-width="1.4"/>

  <!-- document -->
  <g transform="rotate(-9 26 32)">
    <path d="M13.5 14.5 H32.5 L38 20 V49 H13.5 Z" fill="#fbf3e0" stroke="#c9b48e" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M32.5 14.5 V20 H38" fill="#eadbbd" stroke="#c9b48e" stroke-width="0.6" stroke-linejoin="round"/>
    <g stroke="#b9a37c" stroke-width="1.1" stroke-linecap="round">
      <path d="M17.5 21 H29"/>
      <path d="M17.5 25.5 H34"/>
      <path d="M17.5 30 H34"/>
      <path d="M17.5 34.5 H34"/>
      <path d="M17.5 39 H27"/>
    </g>
    <!-- gold signature flourish -->
    <path d="M18 44.5 C20 41.5 21.5 46.5 23.5 43.5 C25 41.5 26 45.8 28.5 44" stroke="#c8962e" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- inkpot -->
  <path d="M39.5 43 C39.5 40.2 42 39 46.5 39 C51 39 53.5 40.2 53.5 43 L54.4 51.6 C54.4 54 51 55.2 46.5 55.2 C42 55.2 38.6 54 38.6 51.6 Z" fill="url(#glass)" stroke="url(#gold)" stroke-width="0.9"/>
  <path d="M41.4 43.5 C41.2 46.5 41.3 49.5 41.8 52" stroke="#ffffff" stroke-opacity=".35" stroke-width="1" fill="none" stroke-linecap="round"/>
  <rect x="43.4" y="35.6" width="6.2" height="3.8" rx="0.6" fill="url(#gold)"/>
  <ellipse cx="46.5" cy="35.6" rx="3.6" ry="1.1" fill="#e2b24c" stroke="#a8741f" stroke-width="0.4"/>
  <ellipse cx="46.5" cy="35.6" rx="2.3" ry="0.6" fill="#0b0f18"/>

  <!-- gold quill standing in the inkpot -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M48.9 30.2 C46.6 18.4 53.2 8.6 60.6 4.4 C61.6 11.6 58.4 22.6 50.2 31.2 Z" fill="url(#gold)" stroke="#8a5f17" stroke-width="0.65"/>
    <path d="M50.9 25.4 L48.3 23.8 M52.3 21.4 L49.4 19.4 M54 17.4 L51.2 15 M55.9 13.4 L53.5 10.9 M57.9 9.6 L56 7.6 M51.9 27.2 L55.1 26.6 M53.6 23.2 L57 22.2 M55.4 19.2 L58.6 17.8 M57.2 15.2 L60 13.6 M58.9 11.2 L60.8 9.9" stroke="#8a5f17" stroke-width="0.5" fill="none" opacity=".75"/>
    <path d="M46.5 35.4 L60.2 5.2" stroke="#7a5214" stroke-width="1" fill="none"/>
  </g>
</svg>
