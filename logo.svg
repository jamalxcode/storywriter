<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Portrait of a bard">
  <defs>
    <clipPath id="badge"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#b5552b"/>
  <g clip-path="url(#badge)">
    <!-- doublet -->
    <path d="M6 66 C8 52 18 47 32 47 C46 47 56 52 58 66 Z" fill="#2a241d"/>
    <path d="M32 50 L32 66" stroke="#5a4636" stroke-width="1"/>
    <circle cx="32" cy="54" r="0.9" fill="#e8c15a"/>
    <circle cx="32" cy="58.5" r="0.9" fill="#e8c15a"/>
    <!-- long hair falling behind the neck -->
    <path d="M21.5 22 C18.5 28 18.5 38 21 45 L27 45 C25 38 24.5 30 25 23 Z" fill="#4a2f1d"/>
    <path d="M42.5 22 C45.5 28 45.5 38 43 45 L37 45 C39 38 39.5 30 39 23 Z" fill="#4a2f1d"/>
    <!-- neck -->
    <rect x="29" y="38" width="6" height="8" fill="#e3bf9b"/>
    <!-- face with the famous high forehead -->
    <path d="M32 13.5 C38.5 13.5 41.5 18.5 41.5 25.5 C41.5 33.5 37.5 41 32 41 C26.5 41 22.5 33.5 22.5 25.5 C22.5 18.5 25.5 13.5 32 13.5 Z" fill="#efcfae"/>
    <!-- thinning hair at the temples -->
    <path d="M23.6 21.5 C24.2 17.6 26.4 15.2 29.2 14.4 C27.2 16 25.8 18.2 25.3 21.4 Z" fill="#4a2f1d" opacity=".85"/>
    <path d="M40.4 21.5 C39.8 17.6 37.6 15.2 34.8 14.4 C36.8 16 38.2 18.2 38.7 21.4 Z" fill="#4a2f1d" opacity=".85"/>
    <!-- side hair over the ears -->
    <path d="M23.2 20.5 C21.6 25 21.7 31 23.6 35.5 C24.6 33 24.6 27.5 25.4 23 Z" fill="#4a2f1d"/>
    <path d="M40.8 20.5 C42.4 25 42.3 31 40.4 35.5 C39.4 33 39.4 27.5 38.6 23 Z" fill="#4a2f1d"/>
    <!-- gold earring -->
    <circle cx="23.4" cy="33.8" r="1.1" fill="none" stroke="#e8c15a" stroke-width="0.9"/>
    <!-- brows and eyes -->
    <path d="M26.6 25.2 C27.8 24.4 29.3 24.4 30.3 25" stroke="#4a2f1d" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <path d="M33.7 25 C34.7 24.4 36.2 24.4 37.4 25.2" stroke="#4a2f1d" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <ellipse cx="28.5" cy="27.4" rx="1.05" ry="0.75" fill="#2a241d"/>
    <ellipse cx="35.5" cy="27.4" rx="1.05" ry="0.75" fill="#2a241d"/>
    <!-- nose -->
    <path d="M32.3 27.5 C32.1 29.6 31.4 31.2 30.9 32 C31.6 32.5 32.6 32.5 33.2 32.1" stroke="#c49a78" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- moustache -->
    <path d="M26.8 35.6 C28.6 33.6 30.8 33.9 32 34.6 C33.2 33.9 35.4 33.6 37.2 35.6 C35.4 35.4 33.6 35.6 32 36 C30.4 35.6 28.6 35.4 26.8 35.6 Z" fill="#4a2f1d"/>
    <!-- pointed beard -->
    <path d="M29.3 37.6 C30.6 38.4 33.4 38.4 34.7 37.6 C34.5 40.6 33.2 43.2 32 44.6 C30.8 43.2 29.5 40.6 29.3 37.6 Z" fill="#4a2f1d"/>
    <!-- lace ruff collar -->
    <path d="M18 46 C20 42.5 25 42.8 27 44.2 C28.5 42.4 30.5 42.4 32 44 C33.5 42.4 35.5 42.4 37 44.2 C39 42.8 44 42.5 46 46 C44.5 50 39.5 51.5 32 51.5 C24.5 51.5 19.5 50 18 46 Z" fill="#fbf7ef" stroke="#2a241d" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M22 46.5 C22.8 48 24 49 25.5 49.6 M27 44.6 C27.4 46.8 28.2 48.6 29.2 50.4 M32 44.4 L32 51 M37 44.6 C36.6 46.8 35.8 48.6 34.8 50.4 M42 46.5 C41.2 48 40 49 38.5 49.6" stroke="#2a241d" stroke-width="0.55" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="#2a241d" stroke-opacity=".25" stroke-width="1"/>
</svg>
